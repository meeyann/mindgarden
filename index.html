<style id="garden-discovery-style">

.invite-conditions{margin:8px 0;padding-left:1.3em;line-height:1.7}

<body>
  <a class="skip-link" href="#game">정원으로 바로 가기</a>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="#game" aria-label="RE:ESG 마음정원 처음 화면">
        <span class="brand-symbol" id="brandIcon"></span>
        <span><span class="brand-label">RE:ESG <span class="brand-dot">·</span> AMADO LAB</span><strong>마음정원</strong></span>

      </div>
    </header>

    <main id="game">
      <section aria-labelledby="gardenTitle">
        <div class="garden-heading">
          <div><h1 id="gardenTitle">나의 정원</h1><p>물방울을 모아 식물을 키우고, 정원 속 친구와 놀아 봐.</p></div>
          <time class="garden-date" id="todayDate"></time>
        </div>
        <div class="scene-frame">
            <div class="scene" id="scene">
              <div class="scene-background"></div><div class="care-sky" id="careSky" aria-hidden="true"></div><div class="night-shade"></div><div class="fireflies" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
              <div class="scene-topbar">
                <span class="location-chip" id="locationLabel"></span>
                <button class="sound-chip" id="gardenSoundChip" data-action="sound-open" data-state="off" aria-label="정원의 소리 열기. 기본은 꺼져 있어"><span>정원의 소리</span></button>
              </div>
              <div class="decorations" id="decorations" aria-hidden="true"></div>
              <div id="sceneFriends"></div>

              <button class="plant-button" id="plantButton" data-action="water" aria-label="식물에 물 주기"><span id="plantArt"></span><span class="plant-name" id="plantLabel">작은 씨앗</span></button>
              <div class="watering-fx" id="wateringFx" aria-hidden="true"></div>
            </div>
            <div class="scene-toolbar">
              <div class="garden-progress">

              <button class="text-button" data-action="shop">소품 꺼내기 ↗</button>
              <button class="button button-small arrange-button" id="arrangeButton" data-action="arrange" aria-pressed="false">배치 완료</button>

 function openFriend(id){
  if(!hasFriend(s(),id)){api.openDiscovery();return;}
  selectedFriend=friend(id).id;answer=null;answerReward=null;
  const f=friend(selectedFriend),start=(Math.floor(Date.parse(s().day+'T00:00:00Z')/86400000)+FRIENDS.indexOf(f))%f.questions.length;
  const available=Array.from({length:f.questions.length},(_,i)=>(start+i)%f.questions.length).filter(i=>!s().daily.questions.includes(f.id+':'+i));
  questionIndex=available[0]??-1;drawFriend();
 }
 function drawFriend(){
  const f=friend(selectedFriend),q=questionStatus(s(),f.id),current=questionIndex>=0?f.questions[questionIndex]:null;
  let html=`<div class="conversation-status"><span>${q.seen.length}개의 오늘 질문을 만났어</span><span>${icon('ticket')}추가 질문 <b data-credit-count></b></span></div><div class="talk-layout"><div><div class="talk-portrait">${portrait(f.id)}</div><span class="talk-bond">함께한 이야기 ${s().bonds[f.id]}번</span></div><div>`;
  if(answer!==null){
   html+=`<div class="speech"><small>${f.name}</small><div class="talk-response">${esc(answer)}</div></div><p class="subtle">${api.rewardText(answerReward)}</p><div class="talk-options">${q.remaining>0?btn('friend-next','다음 질문 만나기 '+icon('arrow'),'button button-primary',`data-id="${f.id}"`):btn('tap','추가 질문 씨앗 모으기','button button-soft')}${btn('friends','다른 친구 만나기','button')}</div>`;
  }else if(!current||q.remaining<=0){
   html+=`<div class="speech"><small>${f.name}</small>${q.seen.length>=f.questions.length?'오늘 준비한 질문을 모두 만났어. 내일 새로운 순서로 또 만나자.':'오늘의 기본 질문을 함께 만났구나. 질문 씨앗이 있으면 조금 더 이야기할 수 있어.'}</div><div class="talk-options">${q.seen.length<f.questions.length?btn('tap','톡톡 눌러 추가 질문 열기','button button-primary'):''}${btn('friends','다른 친구 만나기','button')}</div>`;
  }else{
   html+=`<div class="speech"><small>${f.name} · ${q.base>0?'기본 질문':'추가 질문 씨앗 1개 사용'}</small>${esc(current.q)}</div><div class="talk-options">${current.choices.map(([label],i)=>btn('talk-choice',esc(label),'button button-soft',`data-choice="${i}"`)).join('')}${btn('talk-pass','말없이 잠깐 머물래','button button-plain')}</div><p class="subtle">어떤 답을 고르거나 넘어가도 물방울 하나를 받아.</p>`;
  }
  html+='</div></div>';
  html+=`<div class="care-invitation"><div><small>이 친구만의 놀이</small><strong>${CARE_TITLES[f.id]}</strong></div>${btn('care-open','함께 해 보기 '+icon('arrow'),'button button-soft',`data-id="${f.id}"`)}</div>`;
  api.showDialog('friend',f.name+'와 이야기하기','A LITTLE CONVERSATION',html);updateTapLabels();
 }
 function talkChoice(choice){
  if(answer!==null)return;
  const f=friend(selectedFriend),q=f.questions[questionIndex];if(!q)return;
  const r=api.transact({type:'TALK',friend:f.id,index:questionIndex,choice});if(!r.ok)return;
  answer=choice<0?'말하지 않고 함께 머문 시간도 소중해. 다음 이야기는 네가 준비될 때 만나자.':q.choices[choice]?.[1];answerReward=r.reward;api.sound('reward');drawFriend();
 }

 function localFeed(){const day=plazaDay==='today'?s().day:new Date(Date.parse(s().day+'T00:00:00Z')-86400000).toISOString().slice(0,10);return {day,prompt:'지금 내 마음을 한 줄로 남긴다면?',canWrite:true,own:s().localPlaza.find(p=>p.day===day)||null,posts:s().localPlaza.filter(p=>p.day===day).map(p=>({...p,mine:true,hearts:0}))};}
 function openPlaza({local=false}={}){return cloudPlaza&&!local?cloudPlaza.open():openLegacyPlaza();}
 async function openLegacyPlaza(){
  if(localOnly){plazaData=localFeed();plazaError='';drawPlaza();return;}
  const token=++plazaRequest;plazaLoading=true;plazaError='';drawPlaza();
  try{const response=await fetch('/api/plaza?day='+plazaDay,{credentials:'same-origin',headers:{Accept:'application/json'}});if(!response.ok)throw new Error('공유 광장을 불러오지 못했어. 잠깐 뒤 다시 들러 줘.');const data=await response.json();if(token!==plazaRequest)return;plazaData=data;}
  catch(error){if(token!==plazaRequest)return;plazaError=error.message;plazaData=null;}
  finally{if(token===plazaRequest){plazaLoading=false;if(api.mode()==='plaza')drawPlaza({top:false});}}
 }

  return `<article class="trail-card ${done?'is-done':''}" data-trail-card="${t.id}"><div class="trail-card-top"><span class="axis-dot axis-${t.axis}">${t.axis}</span><span>${axisNames[t.axis]}</span><small>${t.minutes}</small></div><h3>${esc(t.title)}</h3><p>${esc(done?(record.note||'해 본 시간을 남겨 두었어요.'):t.prompt)}</p><div class="trail-card-bottom"><span class="subtle">${done?'오늘 남긴 산책':active?'진행 중':recommended?'오늘의 추천 산책':friend(t.friend).name+'의 제안'}</span>${done?icon('check'):btn('trail',active?'이어가기':'이 산책 만나기','button button-small button-soft',`data-id="${t.id}"`)}</div></article>`;
 }
 function openTrails(){

  }

function timerHTML(p){

  return `<div class="timer-box"><span class="timer-digits" id="timerDigits">${fmtTime(remaining)}</span><p id="timerHint">${timer.running?'지금 이 순간에 잠깐 머물러 봐.':p.detail}</p><div class="timer-actions">${button('timer-toggle',(timer.running?icon('pause'):icon('play'))+(timer.running?'잠시 멈추기':'30초 함께 머물기'),'button button-small',`id="timerToggle"`)}${button('timer-reset',icon('reset'),'button button-small',`aria-label="타이머 다시 시작 준비"`)}</div></div>`;
}
function activePractice(){return practiceById(dialogMode==='ritual'?state.draft?.practice:selectedPractice);}
function stopTimer(reset=false){if(timer.interval)clearInterval(timer.interval);timer.interval=null;timer.running=false;if(reset){timer.id=null;timer.context=null;timer.remaining=0;}}
function updateTimer(){
  if(timer.running){timer.remaining=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));if(timer.remaining===0){stopTimer();sound('reward');}}
  if($('#timerDigits'))$('#timerDigits').textContent=fmtTime(timer.remaining);
  if($('#timerToggle'))$('#timerToggle').innerHTML=(timer.running?icon('pause'):icon('play'))+(timer.running?'잠시 멈추기':timer.remaining===0?'한 번 더 머물기':'30초 함께 머물기');
  if($('#timerHint'))$('#timerHint').textContent=timer.running?'지금 이 순간에 잠깐 머물러 봐.':timer.remaining===0?'준비되면 지금의 느낌대로 마무리해도 좋아.':'원하는 만큼 머물다가 마무리해도 괜찮아.';
}
function toggleTimer(){
  const p=activePractice();if(!p?.seconds)return;
  if(timer.id!==p.id||timer.context!==dialogMode){stopTimer(true);timer.id=p.id;timer.context=dialogMode;timer.remaining=p.seconds;}
  if(timer.running){timer.remaining=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));stopTimer();}
  else{if(timer.remaining===0)timer.remaining=p.seconds;timer.running=true;timer.deadline=Date.now()+timer.remaining*1000;timer.interval=setInterval(updateTimer,250);}
  updateTimer();
}

const MEMORY_ICONS=['leaf','flower','drop','bird','sun','heart'];
function freshMemory(){const kinds=[...MEMORY_ICONS,...MEMORY_ICONS];for(let i=kinds.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[kinds[i],kinds[j]]=[kinds[j],kinds[i]];}return{cards:kinds,open:[],matched:[],moves:0,busy:false,won:false,lastReward:null};}
function openMemory(){if(!memory)memory=freshMemory();drawMemory();}
function drawMemory({top=true}={}){
  if(!memory)return;
  let html=`<p class="dialog-copy">같은 그림 두 장을 천천히 찾아 봐.<br>서두르지 않아도 돼. 정원의 작은 모양들을 만나 보자.</p><div class="memory-meta"><span>${icon('leaf')} 찾은 짝 ${memory.matched.length/2} / 6</span><span>뒤집어 본 횟수 ${memory.moves}</span></div><div class="memory-grid">${memory.cards.map((kind,i)=>{const matched=memory.matched.includes(i),shown=matched||memory.open.includes(i);return `<button class="memory-card ${shown?'revealed':''} ${matched?'matched':''}" data-action="memory-card" data-index="${i}" ${matched?'disabled':''} aria-label="${matched?'찾은 짝':shown?'펼친 카드':'뒤집지 않은 카드'} ${i+1}${shown?' · '+({leaf:'마음열매',flower:'꽃',drop:'물방울',bird:'새',sun:'해',heart:'마음'}[kind]):''}" data-focus="memory-${i}">${icon(shown?kind:'garden')}${matched?`<span class="match-tick">${icon('check')}</span>`:''}</button>`;}).join('')}</div>`;
  if(memory.won)html+=`<div class="inline-notice" style="margin-top:18px">${icon('check')}여섯 쌍의 작은 자연을 모두 만났어! ${rewardText(memory.lastReward)||'오늘의 보상은 이미 받았어. 즐겁게 다시 만나 줘서 고마워.'}</div>`;
  else html+=`<p class="memory-message">${memory.busy?'다른 모양이었네. 천천히 기억해 보자.':state.daily.memory?'오늘의 보상은 받았어. 놀이를 더 즐겨도 좋아.':'오늘 처음 여섯 짝을 찾으면 물방울 3개와 마음열매 2개를 받아.'}</p>`;
  html+=`<div class="dialog-actions">${button('memory-new',icon('reset')+'새로 섞기','button button-plain')}${button('close',memory.won?'정원으로 돌아가기':'잠깐 쉬어 가기','button button-soft')}</div>`;
  showDialog('memory','숲의 짝꿍 찾기','A LITTLE GAME IN THE GARDEN',html,{top});
}
function memoryFlip(index){
  if(!memory||memory.busy||memory.won||memory.matched.includes(index)||memory.open.includes(index)||index<0||index>=12)return;
  memory.open.push(index);sound('tap');
  if(memory.open.length===2){memory.moves++;const[a,b]=memory.open;
    if(memory.cards[a]===memory.cards[b]){memory.matched.push(a,b);memory.open=[];sound('reward');
      if(memory.matched.length===12){memory.won=true;const r=transact({type:'MEMORY'});memory.lastReward=r.reward;}
    }else{memory.busy=true;const current=memory;setTimeout(()=>{if(memory!==current)return;memory.open=[];memory.busy=false;if(dialogMode==='memory')drawMemory({top:false});},900);}
  }
  drawMemory({top:false});
}

"growth-review">나의 기록과 회고</button><button class="button button-small" data-action="growth-feedback">선택적인 이용 메모</button></div><h3 class="small-heading">기록을 안전하게 가지고 있기</h3><p class="dialog-copy">진행 상황과 마음 기록은 이 브라우저에 저장돼요.${isFirebasePlazaBuild()?' Google 로그인은 공개 마음광장 쓰기에만 쓰여요.':''} 기기를 바꿀 때는 JSON 백업을 내려받아 새 브라우저에서 불러와요.</p><div class="backup-buttons">${button('export',icon('download')+'백업 내려받기','button button-soft')}${button('import',icon('upload')+'백업 불러오기','button')}</div><details class="care-count-notes"><summary>이전 v1.5로 옮길 때</summary><p>호환 백업에는 기존 정원·마음 일지만 담고 v1.6 친구 놀이와 날짜별 대화 기록은 담지 않아요. 전체 기록은 일반 백업으로 간직해 주세요.</p>${button('export-legacy','v1.5용 호환 백업','button button-small')}</details><div class="backup-buttons">${button('export-original','보완 전 기록 사본 내려받기','button button-small')}</div><p class="subtle">보완 전 사본은 처음 보완판을 저장하기 전의 기록을 별도로 보관해. 현재 기록을 지워도 이 사본과 이미 내려받은 백업은 자동으로 지워지지 않아.</p><input type="file" id="backupInput" accept="application/json,.json" hidden><div class="settings-row" style="margin-top:20px"><div><strong>새로운 정원으로 시작하기</strong><small>현재 브라우저의 기록과 진행을 비워요.</small></div>${button('reset-confirm','처음부터','button button-small button-danger')}</div><p class="subtle" style="margin-bottom:0">RE:ESG 마음정원 v${APP_VERSION} · 아마도랩<br>마음을 알아차리고 생활 속 작은 실천을 이어 가는 놀이예요.</p>`,{top:dialogMode!=='settings'});

function exportOriginalSnapshot(){
 let raw=initialRaw;try{raw=raw||localStorage.getItem(REFINED_SNAPSHOT_KEY);}catch{}
 if(!raw){toast('아직 별도로 보관한 이전 기록이 없어.');return;}
 let payload=raw,name='REESG_Original_Record_Raw.txt',mime='text/plain';
 try{const prior=JSON.parse(raw);if([1,2,3].includes(prior.version)){payload=JSON.stringify({format:'reesg-mind-garden',version:prior.version,exportedAt:new Date().toISOString(),state:prior},null,2);name='REESG_Before_Refinement.json';mime='application/json';}}catch{}
 const url=URL.createObjectURL(new Blob([payload],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function exportBackup(legacy=false){if(blockedStorage){exportOriginalSnapshot();return;}const copy=structuredClone(state);if(legacy){copy.version=2;delete copy.care;}const payload={format:'reesg-mind-garden',version:legacy?2:VERSION,exportedAt:new Date().toISOString(),state:copy};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`REESG_MindGarden_${dayNow()}${legacy?'_v15-compatible':''}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('마음정원 백업 파일을 내려받았어.');}
async function readImport(file){
  if(!file)return;
  try{if(file.size>2*1024*1024)throw new Error('2MB 이하의 마음정원 백업 파일을 골라 주세요.');const parsed=JSON.parse(await file.text());if(parsed.format!=='reesg-mind-garden'||![1,2,VERSION].includes(parsed.version))throw new Error('마음정원에서 만든 지원되는 버전의 백업 파일을 골라 주세요.');importCandidate=normalizeState(parsed.state,dayNow());
    showDialog('import-confirm','이 기록으로 정원을 이어 갈까요?','RESTORE YOUR GARDEN',`<p class="dialog-copy">불러온 백업에 이야기 ${importCandidate.sessions.length}개, 함께 키운 식물 ${importCandidate.trees}개,<br>간직한 친구 놀이 ${importCandidate.care.records.length}개, 날짜별 대화 ${importCandidate.care.talks.length}개, 오늘의 질문 기록 ${importCandidate.care.questions?.entries?.length||0}개가 있어.<br>만난 친구 ${discoveredIds(importCandidate).length}명과 카드 흔적 ${importCandidate.care.cardTraces?.records.length||0}개도 함께 읽었어.<br>현재 브라우저의 진행을 이 백업으로 바꾸게 돼.</p><div class="inline-notice warm">${icon('book')}지금의 기록도 필요하다면 먼저 백업을 내려받아 줘.</div><div class="dialog-actions">${button('export',icon('download')+'지금 기록 백업','button')}${button('confirm-import','이 백업으로 이어가기','button button-primary')}</div>`);
  }catch(e){toast(e instanceof SyntaxError?'백업 파일을 읽지 못했어. 마음정원에서 내려받은 JSON 파일인지 확인해 줘.':e.message);}
}
function openHelp(){showDialog('help','어서 와, 마음정원에','WELCOME TO YOUR LITTLE GARDEN',`<p class="dialog-copy">다섯 친구와 지금의 마음을 만나고,<br>생활 속 작은 돌봄으로 나만의 정원을 가꾸는 곳이야.</p><div class="help-grid"><div class="help-card">${icon('heart')}<h3>1. 마음 만나기</h3><p>감정을 고르고, 그 뒤의 생각과 바람을 살펴봐. 말하고 싶지 않으면 넘어가도 좋아.</p></div><div class="help-card">${icon('drop')}<h3>2. 작은 돌봄 해 보기</h3><p>친구와 이야기하거나 작은 실천을 해 보면 물방울이 모여. 첫 마음 한 바퀴에도 보상이 있어.</p></div><div class="help-card">${icon('garden')}<h3>3. 나만의 정원 키우기</h3><p>물방울 하나로 한 번 물을 줄 수 있어. 마음열매를 모아 소품과 친구 장식, 새로운 풍경도 골라 봐.</p></div></div><ul class="help-rules"><li>‘오늘’에서 날마다 새로운 마음 질문을 만나. 읽기만 해도, 지나가도 괜찮아. 남기고 싶을 때만 내 기록에 간직해.</li><li>정원의 소리는 직접 재생을 눌러야 들려. 음량·끝나는 시간을 고르고, 언제든 모든 소리를 끌 수 있어.</li><li>다섯 친구 놀이에서 마음 날씨·다시 듣기·쉼·연결 지도·생각 매듭을 만나 봐. 정원의 친구를 두 번 빠르게 누르거나 친구 놀이 버튼으로 열 수 있어.</li><li>기록 모아 보기에서 7일·30일의 실제 기록을 살펴봐. 친구 놀이 결과는 직접 간직한 것만 더해.</li><li>돌봄 산책을 고르고 해 본 만큼 남겨 봐. 관찰 놀이와 친구 편지, 나의 돌봄 나침반도 만날 수 있어.</li><li>정원 카드는 내가 쓴 한 문장만 담아 미리 본 뒤 PNG로 저장하거나 공유해.</li><li>친구를 다섯 번 누르면 추가 질문 하나가 열려. 하루 네 개까지, 빨리 누르든 천천히 누르든 똑같이 모여.</li><li>‘더 보기’의 다른 놀이와 정원 도구에서 소품 배치를 열고 끌어 옮겨. 친구 장식은 머리·얼굴·목·손에 하나씩 달 수 있어.</li><li>광장에 직접 적어 남긴 한 줄만 다른 방문자와 공유해. 마음 기록은 나만의 기록으로 남겨 둬.</li><li>어떤 감정을 골라도 보상은 같아. 마음에 정답은 없어.</li><li>오늘은 쉬어 가도 괜찮아. 며칠 뒤에 와도 식물은 기다리고 있어.</li><li>오늘의 정원 짝꿍에서 여덟 번 골라 식물을 만나 봐. 기본 3종 다음은 마음열매로 열 수 있어.</li><li>물 주기 15번이면 식물이 다 자라. 씨앗을 모으면 작은 숲에 남아.</li><li>마음 기록과 진행은 이 브라우저에 저장돼. 설정에서 백업을 내려받을 수 있어.</li><li>작은 실천은 직접 해 본 만큼 골라 줘. 약속한 일과 해 본 일은 따로 남겨 둘게.</li></ul><div class="inline-notice">${icon('leaf')}처음 온 너에게 물방울 1개와 마음열매 2개를 준비했어. 작은 꽃 소품부터 만나 봐도 좋아.</div><div class="dialog-actions">${button('close','정원 둘러보기','button')}${button('ritual','지금의 마음 만나기 '+icon('arrow'),'button button-primary')}</div>`,{wide:true});}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el||el.disabled)return;

  switch(a){

    case 'sound':transact({type:'SETTING',key:'sound',value:!state.settings.sound});sound();toast(state.settings.sound?'작은 효과음을 켰어.':'소리를 잠시 쉬게 했어.');break;
    case 'night':transact({type:'SETTING',key:'night',value:!state.settings.night});sound();break;
    case 'setting':transact({type:'SETTING',key:el.dataset.key,value:!state.settings[el.dataset.key]});if(el.dataset.key==='sound')sound();openSettings();break;
    case 'water':water();break;
    case 'harvest':{const r=transact({type:'HARVEST'});if(r.ok){sound('grow');showDialog('harvest-success','새로운 씨앗을 품었어','OUR LITTLE FOREST',`<div class="empty-state">${icon('seed')}<h3>함께 키운 식물 ${state.trees}그루</h3><p>다 자란 식물은 마음 기록 속 작은 숲에 남겨 뒀어.<br>마음열매 8개도 받았어. 다음 씨앗을 만나 볼까?</p>${button('close','다시 정원으로','button button-primary')}</div>`);}break;}
    case 'ritual':openRitual();break;
    case 'ritual-emotion':case 'ritual-after':{const key=a==='ritual-emotion'?'emotions':'after',arr=state.draft[key];if(!arr.includes(value)&&arr.length>=3){toast('가까운 마음을 세 개까지 골라 줘.');break;}setDraft({[key]:arr.includes(value)?arr.filter(x=>x!==value):[...arr,value]});drawRitual({top:false});break;}
    case 'emotion-add':addEmotion();break;
    case 'ritual-need':{const arr=state.draft.needs;if(!arr.includes(value)&&arr.length>=2){toast('지금 가까운 바람을 두 개까지 골라 줘.');break;}syncFields();setDraft({needs:arr.includes(value)?arr.filter(x=>x!==value):[...arr,value]});drawRitual({top:false});break;}
    case 'ritual-practice':stopTimer(true);setDraft({practice:id,outcome:'planned'});drawRitual({top:false});break;
    case 'ritual-outcome':setDraft({outcome:value});drawRitual({top:false});break;
    case 'ritual-next':syncFields();stopTimer(true);setDraft({stage:Math.min(3,state.draft.stage+1)});renderMain();drawRitual();break;
    case 'ritual-back':syncFields();stopTimer(true);setDraft({stage:Math.max(0,state.draft.stage-1)});renderMain();drawRitual();break;
    case 'ritual-skip':{const st=state.draft.stage;stopTimer(true);setDraft({stage:Math.min(3,st+1),...(st===0?{emotions:[]}:st===1?{needs:[],note:''}:{practice:null,outcome:'skipped'})});renderMain();drawRitual();break;}
    case 'ritual-save':finishRitual();break;
    case 'ritual-water':closeDialog();water();break;

    case 'practice-done':{const already=state.daily.missions.includes(id),r=transact({type:'PRACTICE',id,outcome:el.dataset.outcome},{quiet:true});if(r.ok||already){sound('reward');showDialog('practice-success','작은 돌봄을 남겼어','A SMALL ACTION, A LITTLE ROOT',`<div class="empty-state"><div class="success-art">${friendSprite('forest')}</div><h3>${el.dataset.outcome==='partial'?'조금 해 본 시간도 소중해.':'지금의 나를 돌봐 줬구나.'}</h3><p>${esc(practiceById(id)?.title)}<br>${already?'오늘의 보상은 이미 받았어. 다시 만나 줘서 고마워.':rewardText(r.reward)}</p><div class="timer-actions">${button('missions','다른 실천 둘러보기','button')}${button('ritual-water','정원에 물 주기 '+icon('drop'),'button button-primary')}</div></div>`);}else toast(r.reason);break;}
    case 'timer-toggle':toggleTimer();break;

    case 'shop-tab':shopTab=value;drawShop();break;
    case 'shop-friend':shopFriend=id;drawShop({top:false});break;
    case 'buy':{const r=transact({type:'BUY',id,friend:shopFriend});if(r.ok){sound('reward');drawShop({top:false});toast('새로운 작은 즐거움을 정원에 더했어.');}break;}
    case 'equip':{const r=transact({type:'EQUIP',id,friend:shopFriend});if(r.ok){sound();drawShop({top:false});}break;}
    case 'seed':transact({type:'SEED',seed:id});drawShop({top:false});sound();break;
    case 'journal':openJournal();break;
    case 'journal-more':journalLimit+=10;drawJournal({top:false});break;
    case 'memory':openMemory();break;
    case 'memory-card':memoryFlip(Number(el.dataset.index));break;
    case 'memory-new':memory=freshMemory();drawMemory();break;
    case 'storybook':openStorybook();break;
    case 'story-page':galleryPage=Number(el.dataset.index);galleryVariant=0;drawStorybook();break;
    case 'story-variant':galleryVariant=Number(el.dataset.index);drawStorybook();break;
    case 'story-activity':{const s=SCENES[Number(el.dataset.index)];if(!s)break;if(s.action==='practice')openPractice(s.practice);else if(s.action==='friend')openFriend(s.friend);else if(s.action==='ritual')openRitual();else if(s.action==='journal')openJournal();else if(s.action==='memory')openMemory();else if(s.action==='plaza')expansion.openPlaza();else if(s.action==='tap')expansion.openTap();else if(s.action==='missions')openMissions();else openFriends();break;}
    case 'export':exportBackup();break;
    case 'export-legacy':exportBackup(true);break;
    case 'export-original':exportOriginalSnapshot();break;
    case 'import':($('#backupInput')||$('#importInput')).click();break;
    case 'confirm-import':if(importCandidate){blockedStorage=false;state=importCandidate;importCandidate=null;memory=null;persist();renderMain();closeDialog();toast('백업 속 정원을 불러왔어.');}break;
    case 'reset-confirm':showDialog('reset-confirm','새로운 정원으로 시작할까요?','START A NEW LITTLE GARDEN',`<p class="dialog-copy">현재 브라우저의 마음 기록, 소품, 식물의 성장을 모두 비우게 돼.<br>기록을 가지고 있고 싶다면 먼저 백업을 내려받아 줘.</p><div class="dialog-actions">${button('export',icon('download')+'기록 먼저 백업','button')}${button('reset-do','기록을 비우고 새로 시작','button button-danger')}</div>`);break;
    case 'reset-do':blockedStorage=false;state=newState(dayNow());memory=null;persist();renderMain();closeDialog();toast('새로운 씨앗으로 정원을 시작했어.');break;
  }
});
window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY)syncFromStorage();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncFromStorage();const prior=state.day;renderMain();if(prior!==state.day&&dialogMode==='ritual')openRitual();}});
setInterval(()=>{if(state.day!==dayNow()){renderMain();if(dialogMode==='ritual')openRitual();}},60000);
const expansion=createExpansion({openDiscovery:()=>discovery.book(),share:options=>journeys.openShare(options),getState:()=>state,transact,mode:()=>dialogMode,showDialog,closeDialog,toast,sound,rewardText});
const journeys=createJourneys({openPlaza:options=>expansion.openPlaza(options),getState:()=>state,transact,mode:()=>dialogMode,showDialog,closeDialog,toast,sound,rewardText});
const botany=createBotany({getState:()=>state,transact,mode:()=>dialogMode,showDialog,toast,sound,share:(options)=>journeys.openShare(options)});
care=createCare({openDiscovery:()=>discovery.book(),getState:()=>state,transact,mode:()=>dialogMode,showDialog,closeDialog,toast});
pathways=createPathways({getState:()=>state,transact,mode:()=>dialogMode,showDialog,closeDialog,toast});
growth=createGrowth({openDiscovery:()=>discovery.book(),hadSave:hadSavedGarden,getState:()=>state,transact,mode:()=>dialogMode,showDialog,closeDialog,toast});
daily=createDaily({hadSave:hadSavedGarden,getState:()=>state,transact,mode:()=>dialogMode,showDialog,closeDialog,toast,openRitualFor,plantLabel});
soundscape=createSoundscape({getState:()=>state,transact,mode:()=>dialogMode,showDialog,closeDialog,toast});
discovery=createDiscovery({getState:()=>state,transact,showDialog});
cards=createCardJourney({getState:()=>state,transact,mode:()=>dialogMode,showDialog,closeDialog,toast});
renderMain();
if(storageError){$('#saveWarning').textContent='기존 기록을 읽지 못해 새 저장을 멈췄어. 설정에서 보완 전 원문을 보관하거나 백업을 불러와 줘.';$('#saveWarning').hidden=false;}

return {};
})();

})();</script></body>
</html>
